<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>云朵字编辑器 | 离线专业版</title>
 <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
 <script src="config.js"></script>
 <script src="tt-core.js"></script>
 <style>
 :root{--primary:#4facfe;--primary-dark:#00f2fe;--bg:#f4f9fc;--card:#fff;--text:#2c3e50;--border:#e2e8f0;--danger:#ff6b6b;--success:#10b981;--gold:#fbbf24}
 *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;user-select:none}
 body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
 header{background:var(--card);padding:16px 24px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;justify-content:space-between;align-items:center;z-index:10}
 header h1{font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--primary-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
 .header-right{display:flex;align-items:center;gap:15px}
 .status-badge{font-size:.85rem;padding:4px 10px;border-radius:20px;font-weight:600;display:flex;align-items:center;gap:5px}
 .status-free{background:#f1f5f9;color:#64748b}
 .status-pro{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#b45309}
 .btn{padding:8px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:.2s;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
 .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff}
 .btn-gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#fff}
 .workspace{flex:1;display:grid;grid-template-columns:320px 1fr;gap:20px;padding:20px;max-width:1400px;margin:0 auto;width:100%;overflow:hidden}
 .sidebar{background:var(--card);padding:16px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:16px;overflow-y:auto}
 .panel{border-bottom:1px solid var(--border);padding-bottom:14px}
 .panel-title{font-size:.9rem;font-weight:600;margin-bottom:10px;color:#444}
 input[type="text"],select{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;outline:none}
 .obj-list{max-height:180px;overflow-y:auto;border:1.5px solid var(--border);border-radius:8px;padding:4px;background:#fafbfc}
 .obj-item{padding:7px 8px;background:#fff;border-radius:6px;margin-bottom:3px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;border:1px solid transparent}
 .obj-item.active{background:#dbeafe;border-color:#93c5fd}
 .viewport{flex:1;display:flex;justify-content:center;align-items:center;background:#f1f5f9;padding:20px;overflow:auto}
 #mainCanvas{max-width:100%;max-height:100%;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:4px;cursor:crosshair}
 .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
 .modal.active{display:flex}
 .modal-content{background:#fff;padding:24px;border-radius:16px;width:90%;max-width:380px;text-align:center}
 </style>
</head>
<body>
<header>
 <h1>☁️ 云朵字编辑器</h1>
 <div class="header-right">
 <button class="btn btn-primary" onclick="generateSharePoster()"><i class="fas fa-share-alt"></i> 分享海报</button>
 <div id="statusBadge" class="status-badge status-free">🔒 免费用户</div>
 <button class="btn btn-gold" onclick="openPayModal()">🔑 激活会员</button>
 </div>
</header>
<div class="workspace">
 <aside class="sidebar">
 <div class="panel">
 <div class="panel-title">➕ 添加元素</div>
 <input type="text" id="txtInput" placeholder="输入文字" value="云朵字" maxlength="10">
 <div style="display:flex; gap:8px; margin-top:10px">
 <input type="color" id="colorPick" value="#FF4500" style="width:40px;height:40px;border:none;cursor:pointer">
 <select id="fontPick"><option value="'Microsoft YaHei'">黑体</option><option value="'KaiTi'">楷体</option></select>
 </div>
 <button class="btn btn-primary" style="width:100%; margin-top:10px" onclick="addObj()">添加到画布</button>
 </div>
 <div class="panel">
 <div class="panel-title">📋 图层列表</div>
 <div class="obj-list" id="objList"></div>
 </div>
 <div class="panel" id="editPanel" style="display:none">
 <div class="panel-title">🎨 编辑选中</div>
 <button class="btn" style="width:100%; background:#fee2e2; color:#dc2626" onclick="delObj()">🗑️ 删除选中</button>
 </div>
 <button class="btn btn-gold" style="width:100%" onclick="exportPng()">📥 导出 PNG</button>
 </aside>
 <section class="viewport">
 <canvas id="mainCanvas"></canvas>
 </section>
</div>

<div class="modal" id="payModal">
 <div class="modal-content">
 <h3>👑 激活高级会员</h3>
 <p style="margin:10px 0; font-size:0.85rem">设备ID: <span id="curID" style="color:var(--primary); font-weight:700"></span></p>
 <input type="text" id="keyInput" placeholder="输入卡密 TEACHERPRO-...">
 <button class="btn btn-gold" style="width:100%; margin-top:15px" onclick="doActivate()">立即激活</button>
 <button onclick="closePayModal()" style="background:none; border:none; color:#94a3b8; margin-top:10px; cursor:pointer; text-decoration:underline">关闭</button>
 </div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const W = 1240, H = 1754;
canvas.width = W; canvas.height = H;

// 核心类
class CloudObj {
 constructor(txt, col, font, x, y) { 
 this.id = Date.now() + Math.random(); 
 this.txt = txt; this.col = col; this.font = font; this.x = x; this.y = y; this.sc = 1; this.rot = 0; 
 }
 draw(c, isSelected) {
 c.save(); c.translate(this.x, this.y); c.rotate(this.rot * Math.PI / 180); c.scale(this.sc, this.sc);
 c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `900 100px ${this.font}`;
 c.strokeStyle = this.col; c.lineWidth = 45; c.lineJoin = 'round'; c.strokeText(this.txt, 0, 0);
 c.lineWidth = 18; c.strokeStyle = '#000'; c.strokeText(this.txt, 0, 0);
 c.fillStyle = '#FFF'; c.fillText(this.txt, 0, 0);
 if (isSelected) {
 c.strokeStyle = '#4facfe'; c.lineWidth = 4; c.setLineDash([10, 10]);
 const m = c.measureText(this.txt); c.strokeRect(-m.width/2-30, -70, m.width+60, 140);
 }
 c.restore();
 }
 hit(px, py) {
 const dx = px - this.x, dy = py - this.y;
 return Math.sqrt(dx*dx + dy*dy) < 100;
 }
}

// 数据持久化集成
let objects = (TT_SDK.Store.get('cloud_text_v2_data') || []).map(o => Object.assign(new CloudObj(), o));
let selected = null, dragging = false, offset = { x: 0, y: 0 };

function render() {
 ctx.fillStyle = '#FFF'; ctx.fillRect(0,0,W,H);
 objects.forEach(o => o.draw(ctx, o === selected));
 TT_SDK.Store.save('cloud_text_v2_data', objects); // 自动保存
}

function addObj() {
 const t = document.getElementById('txtInput').value || '云朵';
 const c = document.getElementById('colorPick').value;
 const f = document.getElementById('fontPick').value;
 objects.push(new CloudObj(t, c, f, W/2, H/2));
 render(); updateList();
}

async function generateSharePoster() {
 const url = await TT_SDK.makePoster(canvas, "我的云朵字创意设计");
 const w = window.open();
 w.document.write(`<div style="text-align:center; padding:40px; background:#f8fafc; min-height:100vh; font-family:sans-serif">
 <img src="${url}" style="max-width:450px; box-shadow:0 30px 60px rgba(0,0,0,0.15); border-radius:16px; border:8px solid #fff">
 <h2 style="margin-top:20px; color:#1e293b">✨ 作品已生成</h2>
 <p style="color:#64748b">长按上方图片保存，发给同事或朋友圈分享吧！</p>
 </div>`);
}

function delObj() { if(selected){ objects=objects.filter(o=>o!==selected); selected=null; render(); updateList(); document.getElementById('editPanel').style.display='none'; } }
function updateList() {
 const el = document.getElementById('objList');
 el.innerHTML = objects.map(o => `<div class="obj-item ${selected===o?'active':''}" onclick="sel(${o.id})"><span>${o.txt}</span><span onclick="del(${o.id})">✕</span></div>`).join('');
}
function sel(id) { selected = objects.find(o=>o.id===id); document.getElementById('editPanel').style.display='block'; render(); updateList(); }
function del(id) { objects = objects.filter(o=>o.id!==id); if(selected?.id===id)selected=null; render(); updateList(); }

canvas.onmousedown = e => {
 const r = canvas.getBoundingClientRect();
 const x = (e.clientX-r.left)*(W/r.width), y = (e.clientY-r.top)*(H/r.height);
 selected = objects.findLast(o => o.hit(x,y)) || null;
 if(selected) { dragging=true; offset.x=x-selected.x; offset.y=y-selected.y; document.getElementById('editPanel').style.display='block'; }
 else { document.getElementById('editPanel').style.display='none'; }
 render(); updateList();
};
window.onmousemove = e => {
 if(!dragging || !selected) return;
 const r = canvas.getBoundingClientRect();
 selected.x = (e.clientX-r.left)*(W/r.width) - offset.x;
 selected.y = (e.clientY-r.top)*(H/r.height) - offset.y;
 render();
};
window.onmouseup = () => dragging = false;

async function doActivate() {
 const res = await TT_SDK.premium.activate(document.getElementById('keyInput').value);
 alert(res.msg); if(res.ok) location.reload();
}
function openPayModal() { 
 TT_SDK.getFingerprint().then(id => document.getElementById('curID').innerText = id);
 document.getElementById('payModal').classList.add('active'); 
}
function closePayModal() { document.getElementById('payModal').classList.remove('active'); }

if(TT_SDK.premium.isPro) {
 const b = document.getElementById('statusBadge');
 b.innerText = "👑 尊享会员"; b.className = "status-badge status-pro";
}
render(); updateList();
</script>
</body>
</html>
