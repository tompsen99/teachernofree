<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <title>卡密生成器 | 教师工具站</title>
 <script src="config.js"></script>
 <style>
 body{font-family:system-ui,sans-serif; background:#f8fafc; padding:40px}
 .card{background:#fff; padding:30px; border-radius:16px; max-width:500px; margin:auto; box-shadow:0 10px 25px rgba(0,0,0,0.05)}
 input, select{width:100%; padding:12px; margin:10px 0; border:2px solid #e2e8f0; border-radius:8px}
 button{width:100%; padding:14px; background:#4facfe; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer}
 </style>
</head>
<body>
 <div class="card">
 <h2>🔐 会员卡密生成</h2>
 <select id="type"><option value="30d">30天会员</option><option value="permanent">永久会员</option></select>
 <input type="text" id="deviceId" placeholder="绑定设备 ID (可选，留空则通用)">
 <button onclick="generate()">点击生成</button>
 <textarea id="result" style="width:100%; height:100px; margin-top:20px; padding:10px; border-radius:8px; border:2px solid #e2e8f0; font-family:monospace" readonly></textarea>
 </div>
 <script>
 async function generate() {
 const type = document.getElementById('type').value;
 const device = document.getElementById('deviceId').value.trim();
 const secret = SITE_CONFIG.SECRET_KEY;
 const days = type === '30d' ? 30 : 0;
 const expiry = days > 0 ? Date.now() + days * 86400000 : null;
 const payload = { t: type, i: Date.now(), e: expiry, d: device };
 const signData = JSON.stringify(payload);
 const enc = new TextEncoder();
 const k = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
 const s = await crypto.subtle.sign('HMAC', k, enc.encode(signData));
 const sig = Array.from(new Uint8Array(s)).map(b => b.toString(16).padStart(2, '0')).join('');
 payload.s = sig;
 document.getElementById('result').value = 'TEACHERPRO-' + btoa(JSON.stringify(payload));
 }
 </script>
</body>
</html>
