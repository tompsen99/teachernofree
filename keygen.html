<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>后台管理 | 卡密授权中心</title>
    <script src="config.js"></script>
    <style>
        :root{--primary:#4facfe;--bg:#f8fafc;--card:#fff;--text:#1e293b;--light:#64748b;--border:#e2e8f0}
        *{box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:var(--bg);color:var(--text);padding:40px;display:flex;justify-content:center}
        .card{background:var(--card);padding:40px;border-radius:24px;width:100%;max-width:500px;box-shadow:0 20px 50px rgba(0,0,0,0.05)}
        h2{margin-bottom:20px;font-weight:800;letter-spacing:-1px}
        label{display:block;font-size:0.9rem;color:var(--light);margin-bottom:8px;margin-top:20px;font-weight:600}
        input, select, textarea{width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;font-size:1rem;outline:none;transition:0.2s}
        input:focus, select:focus{border-color:var(--primary)}
        .btn-gen{width:100%;padding:16px;background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff;border:none;border-radius:12px;font-weight:700;font-size:1.1rem;cursor:pointer;margin-top:30px;box-shadow:0 10px 20px rgba(79,172,254,0.3)}
        .btn-gen:active{transform:scale(0.98)}
        .tip{font-size:0.8rem;color:var(--light);margin-top:10px;line-height:1.5}
        #result{margin-top:20px;height:120px;background:#f1f5f9;border:none;font-family:monospace;color:#1e293b}
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 授权卡密生成器</h2>
        <p style="color:var(--light); font-size:0.9rem">生成的卡密将使用 <code>config.js</code> 中的私钥进行签名</p>
        
        <label>⏱️ 会员有效时长</label>
        <select id="keyType">
            <option value="30d">30 天高级会员</option>
            <option value="permanent">永久高级会员</option>
        </select>
        
        <label>📱 绑定特定设备ID (由老师在主页提供)</label>
        <input type="text" id="deviceId" placeholder="留空则卡密全设备通用">
        <p class="tip">💡 提示：填写后，该卡密只能在该设备上激活，防止被老师随意转发。</p>
        
        <button class="btn-gen" onclick="generate()">生成激活码</button>
        
        <label>📋 生成结果 (复制给老师)</label>
        <textarea id="result" readonly placeholder="激活码将在这里显示..."></textarea>
        <button onclick="copyKey()" style="margin-top:10px; background:none; border:none; color:var(--primary); cursor:pointer; font-weight:600; text-decoration:underline">点击复制到剪贴板</button>
    </div>

    <script>
        async function generate() {
            const type = document.getElementById('keyType').value;
            const device = document.getElementById('deviceId').value.trim();
            const secret = SITE_CONFIG.SECRET_KEY;
            
            if(!secret || secret === "ChangeThisToYourOwnSuperSecretKey_2026!") {
                alert("警告：请先在 config.js 中修改 SECRET_KEY 以保证安全！");
            }

            const days = type === '30d' ? 30 : 0;
            const expiry = days > 0 ? Date.now() + days * 86400000 : null;
            
            // 构造载荷
            const payload = { 
                t: type, 
                i: Date.now(), 
                e: expiry, 
                d: device 
            };
            
            const signData = JSON.stringify(payload);
            
            // HMAC-SHA256 签名过程 (Web Crypto API)
            const enc = new TextEncoder();
            const key = await crypto.subtle.importKey(
                'raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
            );
            const signatureBuffer = await crypto.subtle.sign('HMAC', key, enc.encode(signData));
            const signature = Array.from(new Uint8Array(signatureBuffer))
                .map(b => b.toString(16).padStart(2, '0')).join('');
            
            // 将签名存入载荷
            payload.s = signature;
            
            // Base64 编码
            const finalKey = 'TEACHERPRO-' + btoa(JSON.stringify(payload));
            document.getElementById('result').value = finalKey;
        }

        function copyKey() {
            const el = document.getElementById('result');
            el.select();
            document.execCommand('copy');
            alert('激活码已复制！');
        }
    </script>
</body>
</html>
