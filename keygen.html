<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡密生成器</title>
  <!-- 1. 引入全局配置 -->
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box;font-family:system-ui,sans-serif}
    body{background:#f8fafc;padding:40px 20px;display:flex;justify-content:center}
    .box{background:#fff;padding:30px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08);width:100%;max-width:500px}
    h2{text-align:center;margin-bottom:20px;color:#1e293b}
    label{display:block;font-size:0.9rem;color:#64748b;margin-bottom:6px;font-weight:500}
    input,select,textarea{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1rem;margin-bottom:15px;outline:none}
    input:focus,select:focus{border-color:#4facfe}
    .row{display:flex;gap:15px}
    .row>div{flex:1}
    button{width:100%;padding:14px;background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:0.2s}
    button:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,172,254,0.4)}
    .output-area{position:relative}
    textarea{height:100px;resize:none;font-family:monospace;background:#f1f5f9}
    .copy-btn{position:absolute;top:8px;right:8px;background:#fff;border:1px solid #e2e8f0;padding:4px 10px;border-radius:6px;font-size:0.8rem;cursor:pointer}
    .copy-btn:hover{background:#e2e8f0}
    .tip{font-size:0.8rem;color:#94a3b8;text-align:center;margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <h2>🔑 卡密生成器</h2>
    <label>🔐 发卡密钥 (从 config.js 自动读取)</label>
    <input type="text" id="secretKeyDisplay" disabled placeholder="加载配置中...">
    
    <div class="row">
      <div>
        <label>⏱️ 会员类型</label>
        <select id="cardType">
          <option value="30d">30 天会员</option>
          <option value="permanent">永久会员</option>
        </select>
      </div>
      <div>
        <label>📅 额外赠送 (天)</label>
        <input type="number" id="bonusDays" value="0" min="0">
      </div>
    </div>
    
    <button onclick="generate()">✨ 生成卡密</button>
    
    <div class="output-area">
      <label>📋 生成的卡密</label>
      <textarea id="output" readonly></textarea>
      <button class="copy-btn" onclick="copyKey()">复制</button>
    </div>
    
    <p class="tip">💡 提示：此工具读取 config.js 中的密钥，确保与网站一致。</p>
  </div>

  <script>
    // 2. 初始化时显示配置中的密钥
    window.onload = () => {
        document.getElementById('secretKeyDisplay').value = SITE_CONFIG.SECRET_KEY;
    };

    async function generate() {
      const key = SITE_CONFIG.SECRET_KEY; // 直接使用配置文件的密钥
      
      const type = document.getElementById('cardType').value;
      const bonus = parseInt(document.getElementById('bonusDays').value) || 0;
      const issue = Date.now();
      const days = type === '30d' ? 30 + bonus : 0;
      const expiry = days > 0 ? issue + days * 24 * 60 * 60 * 1000 : null;
      
      const payload = { t: type, i: issue, e: expiry, d: "" };
      const dataStr = JSON.stringify(payload);
      
      try {
        const enc = new TextEncoder();
        const cryptoKey = await crypto.subtle.importKey(
          'raw', enc.encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
        );
        const sigBuffer = await crypto.subtle.sign('HMAC', cryptoKey, enc.encode(dataStr));
        const sig = Array.from(new Uint8Array(sigBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        
        payload.s = sig;
        const base64 = btoa(JSON.stringify(payload));
        document.getElementById('output').value = `TEACHERPRO-${base64}`;
      } catch (e) {
        alert('❌ 生成失败：' + e.message);
      }
    }

    function copyKey() {
      const el = document.getElementById('output');
      el.select();
      document.execCommand('copy');
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '已复制!';
      setTimeout(() => btn.textContent = '复制', 1500);
    }
  </script>
</body>
</html>
